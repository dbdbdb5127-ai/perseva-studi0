<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#18191c"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><link rel="icon" href="../icon-192.png"><link rel="apple-touch-icon" href="../icon-192.png">
<title>PERSEVA 시안 작업판</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#18191c;--ws:#2b2c30;--panel:#222326;--panel2:#2c2d31;--line:#3a3c41;--text:#ececee;--sub:#9fa2a9;--acc:#d6d9de;--sel:#4f9dff;--danger:#ff6b6b;color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#18191c;--ws:#2b2c30;--panel:#222326;--panel2:#2c2d31;--line:#3a3c41;--text:#ececee;--sub:#9fa2a9}}
:root[data-theme="dark"]{--bg:#18191c;--ws:#2b2c30;--panel:#222326;--panel2:#2c2d31;--line:#3a3c41;--text:#ececee;--sub:#9fa2a9}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;white-space:nowrap}
button:hover{border-color:#55585f}button.on{background:var(--acc);color:#111;border-color:var(--acc)}
button:disabled{opacity:.35;cursor:default}
input[type=range]{accent-color:var(--acc);width:100%}
#app{display:grid;grid-template-columns:52px 1fr 340px;grid-template-rows:46px 1fr;height:100dvh;height:100vh}
@supports(height:100dvh){#app{height:100dvh}}
header{grid-column:1/4;display:flex;align-items:center;gap:6px;padding:0 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
header::-webkit-scrollbar{display:none}
header .brand{font-weight:700;letter-spacing:.12em;margin-right:6px;font-size:12px;color:var(--acc)}
header .sp{flex:1}
#tools{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0;overflow-y:auto}
#tools button{width:40px;height:40px;padding:0;display:grid;place-items:center;border-radius:9px}
#tools svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#tools .sepr{width:28px;height:1px;background:var(--line);margin:4px 0}
#colorDot{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #000;cursor:pointer;margin-top:2px}
#stage{position:relative;background:var(--ws);overflow:hidden;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#ctx{position:absolute;left:50%;top:10px;transform:translateX(-50%);display:none;gap:4px;background:rgba(24,25,28,.92);border:1px solid var(--line);border-radius:10px;padding:5px;max-width:calc(100% - 20px);overflow-x:auto;scrollbar-width:none;z-index:3}
#ctx.show{display:flex}#ctx button{padding:5px 9px;font-size:12px}
#ctx .nm{align-self:center;padding:0 6px;color:var(--sub);font-size:12px;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#zoomUI{position:absolute;right:10px;bottom:10px;display:flex;gap:4px;align-items:center;z-index:3}
#zoomUI span{min-width:46px;text-align:center;color:var(--sub);font-size:12px}
#brushPop{position:absolute;left:8px;top:8px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:none;z-index:5;box-shadow:0 10px 30px rgba(0,0,0,.4)}
#brushPop.show{display:block}
#brushPop label{display:block;margin-top:8px;color:var(--sub);font-size:12px}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.sw i{aspect-ratio:1;border-radius:50%;border:1px solid #0006;cursor:pointer}
.sw i.on{outline:2px solid var(--sel);outline-offset:1px}
aside{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;background:none;padding:10px 0;color:var(--sub)}
.tabs button.on{color:var(--text);box-shadow:inset 0 -2px var(--acc);background:none}
.pane{display:none;flex-direction:column;min-height:0;flex:1}
.pane.show{display:flex}
.pbar{padding:8px;display:flex;flex-direction:column;gap:6px;border-bottom:1px solid var(--line)}
.pbar input[type=search]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:7px;color:var(--text);padding:7px 9px;font:inherit}
.chips{display:flex;gap:4px;flex-wrap:wrap}.chips button{padding:4px 9px;font-size:12px;border-radius:20px}
.seg{display:flex}.seg button{flex:1;border-radius:0;font-size:12px;padding:5px}.seg button:first-child{border-radius:7px 0 0 7px}.seg button:last-child{border-radius:0 7px 7px 0}
#grid{flex:1;overflow-y:auto;padding:8px;display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));grid-auto-rows:max-content;gap:8px;align-content:start}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;overflow:hidden;cursor:pointer;position:relative;user-select:none}
.card:active{transform:scale(.97)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:#fff}
.card .t{padding:4px 6px 6px;font-size:11px;line-height:1.3}
.card .t b{color:var(--acc);font-weight:600}
.card .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--sub)}
.card .inf{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;padding:0;font-size:12px;background:rgba(0,0,0,.6);border:0;color:#fff}
.card .used{position:absolute;top:4px;left:4px;background:var(--sel);color:#fff;border-radius:10px;padding:0 6px;font-size:10px}
#layers{flex:1;overflow-y:auto;padding:6px}
.ly{display:flex;align-items:center;gap:6px;padding:5px;border:1px solid transparent;border-radius:8px;cursor:pointer;user-select:none}
.ly.on{background:#334a6b;border-color:var(--sel)}
.ly canvas{width:44px;height:44px;border-radius:5px;background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px;flex:none}
.ly .n{flex:1;min-width:0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ly .n small{display:block;color:var(--sub);font-size:10px}
.ly button{padding:3px 6px;font-size:12px;background:none;border:0}
.ly .off{opacity:.35}
.lyfoot{border-top:1px solid var(--line);padding:8px;display:flex;flex-direction:column;gap:6px}
.lyfoot .row{display:flex;gap:4px;flex-wrap:wrap}.lyfoot .row button{flex:1;padding:6px 4px;font-size:12px}
.lyfoot label{color:var(--sub);font-size:12px;display:flex;align-items:center;gap:8px}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:20}
#sheet{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;display:none;z-index:21}
#sheet h3{margin:0 0 10px;font-size:15px}
#sheet .kv{display:grid;grid-template-columns:72px 1fr;gap:4px 10px;font-size:13px}
#sheet .kv span{color:var(--sub)}
#sheet .btns{display:flex;gap:6px;margin-top:14px;flex-wrap:wrap}
#sheet textarea,#sheet input[type=text]{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px;font:inherit}
#sheet textarea{min-height:90px;resize:vertical}
#sheet .list>div{display:flex;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
#sheet .list img{width:54px;height:54px;border-radius:6px;background:#fff;object-fit:contain}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000c;color:#fff;padding:8px 14px;border-radius:20px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90vw;text-align:center}
#toast.show{opacity:1}
#drawerBtns{display:none}
/* 세로 폰: 아래 서랍 */
@media (max-width:820px) and (orientation:portrait),(max-width:560px){
 #app{grid-template-columns:48px 1fr;grid-template-rows:46px 1fr}
 header{grid-column:1/3}
 aside{position:fixed;left:0;right:0;bottom:0;height:52vh;z-index:10;border-left:0;border-top:1px solid var(--line);border-radius:14px 14px 0 0;transform:translateY(100%);transition:transform .2s}
 aside.open{transform:none}
 #drawerBtns{display:flex;gap:6px}
 #tools button{width:38px;height:38px}
 header .hidem{display:none}
}
/* 가로 폰·작은 태블릿 */
@media (max-height:500px) and (orientation:landscape){
 #app{grid-template-columns:46px 1fr 280px;grid-template-rows:40px 1fr}
 #tools button{width:36px;height:36px}
 #grid{grid-template-columns:repeat(auto-fill,minmax(80px,1fr))}
}
</style></head><body>

<div id="app">
 <header>
  <span class="brand">PERSEVA</span>
  <button id="bUndo" title="되돌리기 (Ctrl+Z)">↶ 되돌리기</button>
  <button id="bRedo" title="다시 (Ctrl+Shift+Z)">↷</button>
  <span id="drawerBtns"><button id="dParts">사진</button><button id="dLayers">레이어</button></span>
  <span class="sp"></span>
  <button id="bPrice">부품값</button>
  <button id="bCanvas">캔버스</button>
  <button id="bSaves">저장함</button>
  <button id="bExport">PNG로 저장</button>
 </header>
 <nav id="tools"></nav>
 <main id="stage">
  <canvas id="cv"></canvas>
  <div id="ctx"></div>
  <div id="brushPop">
   <div class="sw" id="swatch"></div>
   <label>직접 고르기 <input type="color" id="bColor" value="#111111"></label>
   <label>굵기 <b id="vSize"></b><input type="range" id="bSize" min="1" max="120"></label>
   <label>진하기 <b id="vOp"></b><input type="range" id="bOp" min="5" max="100"></label>
   <label>손떨림 보정 <b id="vStab"></b><input type="range" id="bStab" min="0" max="90"></label>
   <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="bArrow"> 선 끝에 화살표</label>
  </div>
  <div id="zoomUI"><button id="zOut">−</button><span id="zVal">100%</span><button id="zIn">+</button><button id="zFit">맞춤</button></div>
 </main>
 <aside id="side">
  <div class="tabs"><button data-t="parts" class="on">부품 사진</button><button data-t="layers">레이어</button></div>
  <div class="pane show" id="pParts">
   <div class="pbar">
    <input type="search" id="q" placeholder="이름·번호·업체 검색">
    <div class="chips" id="cats"></div>
    <div class="seg"><button data-m="photo" class="on">사진 그대로</button><button data-m="cut">배경 뺀 부품</button></div>
   </div>
   <div id="grid"></div>
  </div>
  <div class="pane" id="pLayers">
   <div id="layers"></div>
   <div class="lyfoot">
    <label>투명도 <input type="range" id="lOp" min="0" max="100"></label>
    <div class="row"><button id="lNew">+ 그림 레이어</button><button id="lUp">위로</button><button id="lDown">아래로</button></div>
    <div class="row"><button id="lDup">복제</button><button id="lMerge">아래와 합치기</button><button id="lDel" style="color:var(--danger)">삭제</button></div>
   </div>
  </div>
 </aside>
</div>
<div id="sheetBg"></div><div id="sheet"></div>
<div id="toast"></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const cv=$('#cv'), g=cv.getContext('2d'), stage=$('#stage');
const toastEl=$('#toast');let tT;
function toast(m,ms=1800){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>toastEl.classList.remove('show'),ms)}
const won=n=>n==null?'가격 없음':n.toLocaleString('ko-KR')+'원';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FONT='"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif';

/* ---------- 상태 ---------- */
const doc={W:2400,H:1500,bg:'#ffffff',layers:[]};
let sel=null, tool='select', uid=1, parts=[], partBy={}, imgMode='photo', cat='all';
const view={s:.5,tx:0,ty:0};
const brush={color:'#111111',size:6,op:100,stab:40,arrow:true};
const eraser={size:30};
try{Object.assign(brush,JSON.parse(localStorage.getItem('pvd-brush')||'{}'))}catch(e){}
const L=id=>doc.layers.find(l=>l.id===id);
const selL=()=>sel?L(sel):null;
const mk=(w,h)=>{const c=document.createElement('canvas');c.width=Math.max(1,w);c.height=Math.max(1,h);return c};

/* ---------- 되돌리기 ---------- */
const hist=[],fut=[];
function push(c){hist.push(c);if(hist.length>80)hist.shift();fut.length=0;changed()}
const PK=['x','y','k','rot','flip','opacity','visible','locked','name','text','color','size'];
const props=l=>{const o={};PK.forEach(k=>{if(k in l)o[k]=l[k]});return o};
function apply(c,dir){
 const u=dir<0;
 if(c.t==='pix'){const l=L(c.id);if(l)l[c.tg].getContext('2d').putImageData(u?c.b:c.a,c.r[0],c.r[1]);l&&(l.thumbDirty=1)}
 else if(c.t==='props'){const l=L(c.id);if(l){Object.assign(l,u?c.b:c.a);l.thumbDirty=1}}
 else if(c.t==='add'){if(u){doc.layers.splice(doc.layers.indexOf(c.l),1);if(sel===c.l.id)sel=null}else{doc.layers.splice(c.i,0,c.l);sel=c.l.id}}
 else if(c.t==='del'){if(u){doc.layers.splice(c.i,0,c.l);sel=c.l.id}else{doc.layers.splice(doc.layers.indexOf(c.l),1);if(sel===c.l.id)sel=null}}
 else if(c.t==='order'){const l=doc.layers.splice(u?c.to:c.from,1)[0];doc.layers.splice(u?c.from:c.to,0,l)}
 else if(c.t==='multi'){(u?[...c.list].reverse():c.list).forEach(x=>apply(x,dir))}
 else if(c.t==='canvas'){const s=u?c.b:c.a;doc.W=s.W;doc.H=s.H;doc.bg=s.bg;for(const id in s.cvs){const l=L(+id);if(l){l.cv=s.cvs[id];l.thumbDirty=1}}fit()}
 else if(c.t==='el'){const l=L(c.id);if(l){l.el=u?c.b:c.a;l.thumbDirty=1}}
}
function undo(){const c=hist.pop();if(!c)return;apply(c,-1);fut.push(c);changed()}
function redo(){const c=fut.pop();if(!c)return;apply(c,1);hist.push(c);changed()}
$('#bUndo').onclick=undo;$('#bRedo').onclick=redo;

/* ---------- 레이어 만들기 ---------- */
function newDraw(name){return{id:uid++,type:'draw',name:name||('그림 '+(doc.layers.filter(l=>l.type==='draw').length+1)),visible:true,opacity:1,locked:false,cv:mk(doc.W,doc.H),thumbDirty:1}}
function addLayer(l,i){if(i==null){const s=selL();i=s?doc.layers.indexOf(s)+1:doc.layers.length}doc.layers.splice(i,0,l);sel=l.id;push({t:'add',l,i});return l}
let ASSET=null;const A=u=>ASSET&&ASSET[u]||u;
const imgCache={};
function loadImg(url){if(imgCache[url])return imgCache[url];return imgCache[url]=new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>{delete imgCache[url];rej(new Error(url))};i.src=A(url)})}
function viewCenter(){const r=stage.getBoundingClientRect();return toDoc(r.width/2,r.height/2)}
async function addPart(p,mode){
 const useCut=mode==='cut'&&p.img;
 if(mode==='cut'&&!p.img)toast('이 부품은 배경 뺀 이미지가 없어서 사진 그대로 넣었어');
 const src={kind:'part',no:p.no,mode:useCut?'cut':'photo'};
 let el;try{el=await loadImg(useCut?p.img:'photo/'+p.no+'.webp')}catch(e){toast('사진을 못 불러왔어');return}
 const c=viewCenter(),vis=Math.min(stage.clientWidth,stage.clientHeight)/view.s;
 const k=Math.min(doc.W,vis)*.34/Math.max(el.width,el.height);
 const n=doc.layers.filter(l=>l.src&&l.src.no===p.no).length;
 const l={id:uid++,type:'image',name:'#'+p.no+' '+p.name,visible:true,opacity:1,locked:false,src,el,w:el.width,h:el.height,x:c.x+n*24,y:c.y+n*24,k,rot:0,flip:1,thumbDirty:1};
 addLayer(l,doc.layers.length);setTool('select');
 if(isDrawer())closeDrawer();
}
async function addOwnImage(file){
 const url=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)});
 const el0=await loadImg(url);
 const m=1600,sc=Math.min(1,m/Math.max(el0.width,el0.height));
 const c=mk(Math.round(el0.width*sc),Math.round(el0.height*sc));c.getContext('2d').drawImage(el0,0,0,c.width,c.height);
 const ctr=viewCenter(),vis=Math.min(stage.clientWidth,stage.clientHeight)/view.s;
 const l={id:uid++,type:'image',name:file.name.replace(/\.[^.]+$/,'').slice(0,30)||'내 사진',visible:true,opacity:1,locked:false,src:{kind:'own'},el:c,w:c.width,h:c.height,x:ctr.x,y:ctr.y,k:Math.min(doc.W,vis)*.5/Math.max(c.width,c.height),rot:0,flip:1,thumbDirty:1};
 addLayer(l,doc.layers.length);setTool('select');
}
$('#file').onchange=async e=>{for(const f of e.target.files)await addOwnImage(f);e.target.value='';if(isDrawer())closeDrawer()};

/* ---------- 좌표 ---------- */
const toDoc=(sx,sy)=>({x:(sx-view.tx)/view.s,y:(sy-view.ty)/view.s});
const toScr=(x,y)=>({x:x*view.s+view.tx,y:y*view.s+view.ty});
function textBox(l){const m=mk(1,1).getContext('2d');m.font=`600 ${l.size}px ${FONT}`;const lines=String(l.text||' ').split('\n');let w=0;lines.forEach(s=>w=Math.max(w,m.measureText(s).width));return{w:Math.max(w,l.size*.6)+l.size*.4,h:lines.length*l.size*1.3+l.size*.2,lines}}
function dims(l){if(l.type==='text'){const b=textBox(l);return[b.w,b.h]}return[l.w,l.h]}
function toLocal(l,x,y){const dx=x-l.x,dy=y-l.y,c=Math.cos(-l.rot),s=Math.sin(-l.rot);return{x:(dx*c-dy*s)/l.k*l.flip,y:(dx*s+dy*c)/l.k}}
function corners(l){const[w,h]=dims(l),c=Math.cos(l.rot),s=Math.sin(l.rot);return[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2]].map(([a,b])=>{a*=l.k;b*=l.k;return toScr(l.x+a*c-b*s,l.y+a*s+b*c)})}

/* ---------- 그리기(렌더) ---------- */
let dpr=1,need=true,stroke=null;
function resize(){dpr=Math.min(2,window.devicePixelRatio||1);const r=stage.getBoundingClientRect();cv.width=Math.round(r.width*dpr);cv.height=Math.round(r.height*dpr);need=true}
function drawLayer(c,l){
 if(!l.visible)return;
 c.save();c.globalAlpha=l.opacity;
 if(l.type==='draw'){c.drawImage(l.cv,0,0);if(stroke&&stroke.id===l.id&&stroke.buf){c.globalAlpha=l.opacity*stroke.op;c.drawImage(stroke.buf,0,0)}}
 else{
  c.translate(l.x,l.y);c.rotate(l.rot);c.scale(l.k*l.flip,l.k);
  if(l.type==='image')c.drawImage(l.el,-l.w/2,-l.h/2);
  else{const b=textBox(l);c.font=`600 ${l.size}px ${FONT}`;c.fillStyle=l.color;c.textBaseline='top';if(l.flip<0)c.scale(-1,1);b.lines.forEach((s,i)=>c.fillText(s,-b.w/2+l.size*.2,-b.h/2+l.size*.1+i*l.size*1.3))}
 }
 c.restore();
}
function paintDoc(c,withBg){
 if(withBg&&doc.bg!=='none'){c.fillStyle=doc.bg;c.fillRect(0,0,doc.W,doc.H)}
 doc.layers.forEach(l=>drawLayer(c,l));
}
let checker;
function frame(){
 if(need){need=false;
  g.setTransform(1,0,0,1,0,0);g.fillStyle=getComputedStyle(stage).backgroundColor;g.fillRect(0,0,cv.width,cv.height);
  g.setTransform(dpr*view.s,0,0,dpr*view.s,dpr*view.tx,dpr*view.ty);
  g.shadowColor='rgba(0,0,0,.35)';g.shadowBlur=18*dpr;

}

/* ---------- 저장 (IndexedDB) ---------- */
let dbp=null;
function db(){if(!dbp)dbp=new Promise((res,rej)=>{try{const r=indexedDB.open('pv-draw',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}});return dbp}
async function kv(op,key,val){const d=await db();return new Promise((res,rej)=>{const t=d.transaction('kv',op==='get'?'readonly':'readwrite'),s=t.objectStore('kv');const r=op==='get'?s.get(key):op==='del'?s.delete(key):s.put(val,key);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
const blobOf=c=>new Promise(r=>c.toBlob(r,'image/png'));
async function serialize(){
 const layers=[];
 for(const l of doc.layers){const o={id:l.id,type:l.type,...props(l)};
  if(l.type==='draw')o.blob=await blobOf(l.cv);
  if(l.type==='image'){o.src=l.src;o.w=l.w;o.h=l.h;if(l.src.kind!=='part'||l.el instanceof HTMLCanvasElement)o.blob=await blobOf(l.el instanceof HTMLCanvasElement?l.el:(()=>{const c=mk(l.w,l.h);c.getContext('2d').drawImage(l.el,0,0);return c})())}
  layers.push(o)}
 return{W:doc.W,H:doc.H,bg:doc.bg,layers,uid};
}
const imgFromBlob=b=>new Promise((res,rej)=>{const u=URL.createObjectURL(b),i=new Image();i.onload=()=>{res(i)};i.onerror=rej;i.src=u});
async function deserialize(s){
 const out=[];
 for(const o of s.layers){const l={...o,thumbDirty:1};delete l.blob;
  try{
   if(o.type==='draw'){l.cv=mk(s.W,s.H);if(o.blob)l.cv.getContext('2d').drawImage(await imgFromBlob(o.blob),0,0)}
   if(o.type==='image'){if(o.blob){const i=await imgFromBlob(o.blob);const c=mk(i.width,i.height);c.getContext('2d').drawImage(i,0,0);l.el=c}else{const p=partBy[o.src.no];l.el=await loadImg(o.src.mode==='cut'&&p&&p.img?p.img:'photo/'+o.src.no+'.webp')}}
  }catch(e){continue}
  out.push(l)}
 doc.W=s.W;doc.H=s.H;doc.bg=s.bg;doc.layers=out;uid=Math.max(s.uid||1,...out.map(l=>l.id+1),1);sel=null;hist.length=0;fut.length=0;
 fit();renderLayers();renderCtx();
}

 sheet(`<h3>저장함</h3><p style="color:var(--sub);font-size:12px;margin:0 0 8px">지금 작업은 자동으로 이 기기에 저장돼. 여러 시안을 따로 남기고 싶으면 이름 붙여서 저장해. (이 기기·이 브라우저에만 남아)</p>
 <div style="display:flex;gap:6px"><input type="text" id="sn" placeholder="예) 목걸이 A 꼬리 비교"><button class="on" id="ss">저장</button></div>
 <div class="list" style="margin-top:8px">${list.map(w=>`<div><img src="${w.thumb}"><div style="flex:1"><b>${esc(w.name)}</b><div style="color:var(--sub);font-size:11px">${new Date(w.time).toLocaleString('ko-KR')}</div></div><button data-o="${w.id}">열기</button><button data-x="${w.id}" style="color:var(--danger)">삭제</button></div>`).join('')||'<div style="color:var(--sub)">저장한 시안이 없어</div>'}</div><div class="btns"><button id="sc">닫기</button></div>`);
 $('#sc').onclick=closeSheet;
 $('#ss').onclick=async()=>{const name=$('#sn').value.trim()||('시안 '+(list.length+1));const id=Date.now();try{await kv('put','w:'+id,await serialize());list.unshift({id,name,time:id,thumb:smallThumb()});await kv('put','list',list);toast('저장했어');savesSheet()}catch(e){toast('저장 실패: 저장 공간이 모자랄 수 있어')}};
 $$('#sheet [data-o]').forEach(b=>b.onclick=async()=>{const s=await kv('get','w:'+b.dataset.o);if(s){await deserialize(s);closeSheet();toast('불러왔어');autosave()}});
 $$('#sheet [data-x]').forEach(b=>b.onclick=async()=>{await kv('del','w:'+b.dataset.x);list=list.filter(w=>w.id!=b.dataset.x);await kv('put','list',list);savesSheet()});
}

/* ---------- 키보드 ---------- */
addEventListener('keydown',e=>{
 if(e.target.matches('input,textarea'))return;
 const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;
 if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo();return}
 if(m&&k==='y'){e.preventDefault();redo();return}
 if(m&&k==='d'){e.preventDefault();const s=selL();s&&dupLayer(s);return}
 if(m&&k==='0'){e.preventDefault();fit();return}
 if(m&&(k==='='||k==='+')){e.preventDefault();setZoom(view.s*1.25);return}
 if(m&&k==='-'){e.preventDefault();setZoom(view.s/1.25);return}
 if(e.key===' '&&!space){space=true;stage.style.cursor='grab';e.preventDefault();return}
 if(m)return;
 const T={v:'select',h:'hand',b:'pen',p:'pen',e:'eraser',l:'line',t:'text'};
 if(T[k]){setTool(T[k]);return}
 if(k==='delete'||k==='backspace'){const s=selL();if(s){e.preventDefault();delLayer(s)}return}
 if(k==='['||k===']'){const d=k===']'?1:-1;if(tool==='eraser')eraser.size=Math.max(1,Math.min(120,eraser.size+d*3));else brush.size=Math.max(1,Math.min(120,brush.size+d*2));syncBrushUI();if(hoverCursor)hoverCursor.r=tool==='eraser'?eraser.size:brush.size;redraw();return}
 if(e.key.startsWith('Arrow')){const s=selL();if(!s||s.type==='draw'||s.locked)return;e.preventDefault();const st=e.shiftKey?10:1;propChange(s,()=>{if(k==='arrowleft')s.x-=st;if(k==='arrowright')s.x+=st;if(k==='arrowup')s.y-=st;if(k==='arrowdown')s.y+=st})}
 if(k==='escape'){closeSheet();sel=null;renderCtx();refreshLayers();redraw()}
});
addEventListener('keyup',e=>{if(e.key===' '){space=false;stage.style.cursor=tool==='hand'?'grab':''}});

/* ---------- 시작 ---------- */
let fitted=false;new ResizeObserver(()=>{resize();if(!fitted&&stage.clientWidth>0){fitted=true;fit()}}).observe(stage);
// 다른 사이트 사진을 끌어다 놓거나 붙여넣기
stage.addEventListener('dragover',e=>e.preventDefault());
stage.addEventListener('drop',async e=>{e.preventDefault();for(const f of e.dataTransfer.files)if(f.type.startsWith('image/'))await addOwnImage(f)});
addEventListener('paste',async e=>{for(const it of e.clipboardData.items)if(it.type.startsWith('image/'))await addOwnImage(it.getAsFile())});
setTool('select');syncBrushUI();
fetch('bundle.json').then(r=>r.ok?r.json():null).catch(()=>null).then(b=>{ASSET=b;return fetch('parts.json')}).then(r=>r.json()).then(async j=>{
 parts=j;parts.forEach(p=>partBy[p.no]=p);renderGrid();
 try{const s=await kv('get','current');if(s&&s.layers&&s.layers.length){await deserialize(s);toast('하던 작업 불러왔어')}else toast('부품 사진을 누르면 레이어로 들어가',2600)}catch(e){toast('부품 사진을 누르면 레이어로 들어가',2600)}
 renderLayers();
}).catch(()=>toast('부품 목록을 못 불러왔어'));
requestAnimationFrame(frame);
window.__pvd={doc,view,get sel(){return sel},setTool,addPart:(no,m)=>addPart(partBy[no],m)};
})();
</script>

</body></html>
