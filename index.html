<style>
/* Layout: one-screen app. Header bar, 3D stage (left/centre), parts rail (right). Single dark "jewelry tray" look by choice. */
:root{
  --bg:#141517; --panel:#1c1d20; --panel2:#24262a; --line:#33363c;
  --fg:#e9eaec; --mute:#9a9ea6; --accent:#c9ced6; --hot:#7fb3ff; --ok:#7ed6a5; --warn:#f0c674; --bad:#ff8a80;
  --font:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;
  --num:"Space Grotesk","Noto Sans KR",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--hot);outline-offset:2px}
#app{height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
header{display:flex;align-items:center;gap:6px;padding:8px max(12px,env(safe-area-inset-left,0px)) 8px max(12px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line);background:var(--panel);min-width:0}
.brand{font-family:var(--num);font-weight:600;letter-spacing:.18em;font-size:13px;white-space:nowrap}
.brand small{display:block;font-family:var(--font);letter-spacing:0;font-weight:500;color:var(--mute);font-size:11px}
.hgap{flex:1}
.hbtn{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.hbtn:disabled{opacity:.35;cursor:default}
.hbtn.on{background:var(--accent);color:#111;border-color:var(--accent)}
.hscroll{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.hscroll::-webkit-scrollbar{display:none}
main{display:grid;grid-template-columns:1fr 330px;min-height:0}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;touch-action:none;background:radial-gradient(120% 90% at 50% 30%,#26282c 0%,#141517 70%)}
#stage canvas{display:block;width:100%;height:100%}
#hint{position:absolute;left:10px;top:10px;right:190px;font-size:12px;color:var(--mute);pointer-events:none;line-height:1.5}
#hint b{color:var(--fg);font-weight:500}
#scale{position:absolute;left:12px;bottom:12px;font:12px var(--num);color:var(--mute);pointer-events:none}
#scale i{display:block;height:6px;border:1.5px solid var(--mute);border-top:none;margin-top:3px}
#bomchip{position:absolute;right:10px;bottom:10px;background:rgba(28,29,32,.92);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px}
#bomchip b{font-family:var(--num);font-weight:600}
#fab{position:absolute;transform:translate(-50%,-130%);background:var(--hot);color:#0b1830;border:none;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px;box-shadow:0 6px 18px rgba(0,0,0,.5);white-space:nowrap;z-index:5}
#fab.out{background:var(--bad);color:#2a0a08}
#fdel{white-space:nowrap;position:absolute;transform:translate(-50%,-50%);background:#3a1d1b;color:var(--bad);border:1px solid #6b2f2a;border-radius:999px;padding:5px 10px;font-size:12px;z-index:6}
#hmove{position:absolute;transform:translate(-50%,-50%);width:38px;height:38px;border-radius:50%;background:var(--accent);color:#111;display:grid;place-items:center;font-size:20px;box-shadow:0 4px 14px rgba(0,0,0,.5);touch-action:none;cursor:grab;z-index:6}
#zoom{position:absolute;right:10px;top:10px;display:flex;align-items:center;gap:2px;background:rgba(28,29,32,.92);border:1px solid var(--line);border-radius:10px;padding:3px}
#zoom button{background:none;border:none;min-width:34px;height:32px;font-size:18px;border-radius:7px}
#zoom #zFit{font-size:12px;padding:0 8px}
#zoom span{font:12px var(--num);min-width:40px;text-align:center;color:var(--mute)}
.tip{font-size:11px;color:var(--mute)}
#toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:rgba(28,29,32,.95);border:1px solid var(--line);padding:7px 12px;border-radius:8px;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s}
#toast.show{opacity:1}
/* selection toolbar */
#sel{position:absolute;left:8px;right:8px;bottom:46px;background:rgba(28,29,32,.96);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:grid;gap:8px;max-width:560px;margin:0 auto}
#sel .top{display:flex;align-items:center;gap:8px;min-width:0}
#sel .ttl{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1}
#sel .ttl span{color:var(--mute);font-weight:400}
.pills{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:5px 10px;font-size:12px;white-space:nowrap}
.pill.on{background:var(--accent);color:#111;border-color:var(--accent)}
.prow{display:flex;align-items:center;gap:10px}
.prow input[type=range]{flex:1;accent-color:var(--accent);min-width:0}
.prow output{font:13px var(--num);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.acts::-webkit-scrollbar{display:none}
.act{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12px;white-space:nowrap}
.act.red{color:var(--bad)}
.act.blue{color:var(--hot);border-color:#3a5578}
/* side rail */
aside{border-left:1px solid var(--line);background:var(--panel);display:grid;grid-template-rows:auto auto 1fr;min-height:0;min-width:0}
.tabs{display:grid;grid-template-columns:1fr 1fr}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:10px 4px;font-size:14px;color:var(--mute)}
.tab.on{color:var(--fg);border-bottom-color:var(--accent);font-weight:500}
.filters{padding:8px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.filters select,.filters input{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:12px;min-width:0;width:100%}
.filters .chips{display:flex;gap:5px;flex-wrap:wrap}
#list{overflow-y:auto;padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:8px;align-content:start;grid-auto-rows:max-content;overscroll-behavior:contain}
.card{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:0;text-align:left;display:grid;grid-template-rows:auto auto;overflow:hidden;position:relative}
.card:active{transform:scale(.98)}
.card .ph{aspect-ratio:1;background:#2c2e33 center/contain no-repeat;display:block;width:100%}
.card .ph.cut{background-color:#1f2023;background-size:78%}
.card.add{border-style:dashed;place-items:center;min-height:96px;color:var(--mute);font-size:12px;text-align:center;padding:10px}
.card.add b{display:block;font-size:22px;color:var(--fg);font-weight:400}
#upc{width:100%;border-radius:8px;display:block;background:repeating-conic-gradient(#2a2b2f 0 25%,#202125 0 50%) 0 0/16px 16px}
.frm{display:grid;grid-template-columns:auto 1fr;gap:8px 10px;align-items:center;font-size:13px;margin-top:10px}
.frm input,.frm select{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 8px;min-width:0}
.card .tx{padding:6px 7px 7px;font-size:11.5px;line-height:1.35;min-width:0}
.card .no{font:600 12px var(--num)}
.card .nm{color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .pr{font:12px var(--num);margin-top:2px}
.card .tg{position:absolute;left:5px;top:5px;display:flex;gap:3px;flex-wrap:wrap}
.card .tg i{font-style:normal;font-size:10px;background:rgba(10,10,12,.78);border-radius:4px;padding:1px 4px}
.card .tg i.x{color:var(--bad)}
.card .tg i.w{color:var(--warn)}
.card .info{position:absolute;right:4px;top:4px;width:26px;height:26px;border-radius:50%;border:none;background:rgba(10,10,12,.7);font-size:13px;line-height:26px;text-align:center;padding:0}
.card.ex{opacity:.55}
/* sheets */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:0 max(0px,env(safe-area-inset-right,0px)) 0 max(0px,env(safe-area-inset-left,0px))}
.sheet .box{background:var(--panel);border:1px solid var(--line);border-radius:14px 14px 0 0;width:100%;max-width:560px;max-height:86%;overflow:auto;padding:14px max(16px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px))}
.sheet h3{margin:0 0 10px;font-size:16px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet .x{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:13px}
.kv dt{color:var(--mute)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.note{font-size:12px;color:var(--mute);line-height:1.6;margin-top:10px}
.warn{color:var(--warn)}
table.bom{width:100%;border-collapse:collapse;font-size:13px}
table.bom td{padding:7px 4px;border-bottom:1px solid var(--line);vertical-align:top}
table.bom td.n{font-family:var(--num);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
table.bom tr.sum td{font-weight:700;border-bottom:none}
.slots{display:grid;gap:8px}
.slot{display:grid;grid-template-columns:64px 1fr auto;gap:10px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:6px}
.slot img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:#111}
.slot .t{font-size:13px;min-width:0}
.slot .t small{color:var(--mute);display:block}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
textarea{width:100%;min-height:80px;background:var(--panel2);border:1px solid var(--line);border-radius:8px;color:var(--fg);font:12px monospace;padding:8px;box-sizing:border-box}
#shot img{width:100%;border-radius:8px;display:block;background:#000}
/* phone */
@media (max-width:760px){
  main{grid-template-columns:1fr 118px}
  .brand small{display:none}
  #list{grid-template-columns:1fr;gap:6px;padding:6px}
  .card .tx{padding:4px 5px 5px;font-size:10.5px}
  .card .nm{-webkit-line-clamp:1}
  .card .info{width:22px;height:22px;line-height:22px;font-size:11px}
  .filters{padding:6px}
  .tab{font-size:13px;padding:9px 2px}
  #sel{left:6px;right:6px;bottom:44px;padding:7px 8px}
  #hint{font-size:11px;top:54px;right:10px}
  .hide-s{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
  <header>
    <div class="brand">PERSEVA<small>목걸이 조합실</small></div>
    <div class="hscroll">
      <button class="hbtn" id="bUndo" title="되돌리기">↶<span class="hide-s"> 되돌리기</span></button>
      <button class="hbtn" id="bRedo" title="다시">↷</button>

  <main>

      <div id="zoom"><button type="button" id="zOut" aria-label="축소">−</button><span id="zlabel">100%</span><button type="button" id="zIn" aria-label="확대">+</button><button type="button" id="zFit">맞춤</button></div>

    <aside>

  </main>
</div>
<div class="sheet" id="sheet" hidden><div class="box" id="sheetBox"></div></div>

<script type="module">
import * as THREE from 'three';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const $=s=>document.querySelector(s);
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const LS={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){return false}}};

/* ---------- data ---------- */
let PARTS=[],BY={};
const PEND_GROUPS=[['전체',()=>true],['십자가',c=>/십자가|크로스|문장/.test(c)],['링·도형',c=>/링|기하학|코인/.test(c)],['날개·동물',c=>/날개|동물|나비/.test(c)],['오브제·바',c=>/오브제|바$|포인트|각인/.test(c)],['꽃·별·큐빅',c=>/꽃|별|큐빅|스톤|원석|드롭/.test(c)],['고리·커넥터',c=>/고리|커넥터|매듭|925/.test(c)]];

/* ---------- three setup: flat-lay tray seen from above ---------- */
const stage=$('#stage');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.NeutralToneMapping;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(),0.04).texture;
const key=new THREE.DirectionalLight(0xffffff,1.7);key.position.set(-80,160,320);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-260,right:260,top:260,bottom:-260,near:10,far:900});key.shadow.radius=6;key.shadow.bias=-0.0006;
scene.add(key);scene.add(key.target);scene.add(new THREE.AmbientLight(0xffffff,.22));
const cam=new THREE.OrthographicCamera(-1,1,1,-1,-2000,2000);cam.position.set(0,0,600);
let view={cx:0,cy:-40,h:200};
const orbit=new OrbitControls(cam,renderer.domElement);orbit.enabled=false;orbit.addEventListener('change',()=>dirty=true);

const metal=new THREE.MeshStandardMaterial({color:0xdfe2e7,metalness:1,roughness:.17,envMapIntensity:1.2});
const grayBead=new THREE.MeshStandardMaterial({color:0x6f7378,metalness:.3,roughness:.35});

/* tray */
function fabricTex(base){const c=document.createElement('canvas');c.width=c.height=512;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,512,512);const d=x.getImageData(0,0,512,512);for(let i=0;i<d.data.length;i+=4){const n=(Math.random()-.5)*14;d.data[i]+=n;d.data[i+1]+=n;d.data[i+2]+=n}x.putImageData(d,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,6);t.colorSpace=THREE.SRGBColorSpace;return t}
const trayMat=new THREE.MeshStandardMaterial({roughness:1,metalness:0});
const tray=new THREE.Mesh(new THREE.PlaneGeometry(1400,1400),trayMat);tray.position.z=0;tray.receiveShadow=true;scene.add(tray);
const BG={velvet:'#2b2c30',white:'#ecebe7',beige:'#d8cdbd',black:'#121214'};
function setBg(k){if(!BG[k])k='velvet';trayMat.map=fabricTex(BG[k]);trayMat.needsUpdate=true;prefs.bg=k;LS.set('pv-prefs',prefs);
  document.documentElement.style.setProperty('--tray',BG[k]);dirty=true}

/* ---------- geometry helpers (mm) ---------- */
const geoCache=new Map();
class LoopCurve extends THREE.Curve{constructor(L,W,p){super();this.L=L;this.W=W;this.p=p}
  getPoint(t,o=new THREE.Vector3()){const a=t*Math.PI*2,c=Math.cos(a),s=Math.sin(a),e=2/this.p;return o.set(this.L/2*Math.sign(c)*Math.pow(Math.abs(c),e),this.W/2*Math.sign(s)*Math.pow(Math.abs(s),e),0)}}
function ringGeo(L,W,r,p=2){const k=`ring|${L.toFixed(2)}|${W.toFixed(2)}|${r.toFixed(3)}|${p}`;if(!geoCache.has(k))geoCache.set(k,new THREE.TubeGeometry(new LoopCurve(Math.max(.2,L-2*r),Math.max(.2,W-2*r),p),p>2?40:28,r,8,true));return geoCache.get(k)}
function capGeo(L,r){const k=`cap|${L.toFixed(2)}|${r.toFixed(3)}`;if(!geoCache.has(k)){const g=new THREE.CapsuleGeometry(r,Math.max(.01,L-2*r),6,10);g.rotateZ(Math.PI/2);geoCache.set(k,g)}return geoCache.get(k)}
function boxGeo(L,W,T){const k=`box|${L.toFixed(2)}|${W.toFixed(2)}|${T.toFixed(2)}`;if(!geoCache.has(k))geoCache.set(k,new THREE.BoxGeometry(L,W,T));return geoCache.get(k)}
function ballGeo(r){const k=`ball|${r.toFixed(3)}`;if(!geoCache.has(k))geoCache.set(k,new THREE.SphereGeometry(r,16,12));return geoCache.get(k)}
function pattern(type,w){const R=(L,W,r,p)=>()=>ringGeo(L,W,r,p);
  switch(type){
    case 'cable':return[{g:R(1.45*w,w,.17*w),pitch:1.07*w,roll:0},{g:R(1.45*w,w,.17*w),pitch:1.07*w,roll:90}];
    case 'lip':return[{g:R(1.6*w,w,.14*w),pitch:1.2*w,roll:25},{g:R(1.6*w,w,.14*w),pitch:1.2*w,roll:-25}];
    case 'figaro':return[{g:R(3.2*w,w*.9,.13*w,3),pitch:2.8*w,roll:0},{g:R(1.3*w,w*.8,.13*w),pitch:.95*w,roll:90}];
    case 'figaro31':{const s={g:R(1.35*w,w*.9,.15*w),pitch:1.0*w};return[{...s,roll:0},{...s,roll:90},{...s,roll:0},{g:R(3*w,w*.9,.15*w),pitch:2.65*w,roll:90}]}
    case 'longshort':return[{g:R(3*w,w,.11*w,3),pitch:2.7*w,roll:0},{g:R(1.25*w,w*.8,.11*w),pitch:.95*w,roll:90}];
    case 'paperclip':return[{g:R(2.4*w,w,.12*w,3.2),pitch:2.1*w,roll:0},{g:R(2.4*w,w,.12*w,3.2),pitch:2.1*w,roll:90}];
    case 'paperclip31':{const s={g:R(1.4*w,w,.14*w),pitch:1.1*w};return[{...s,roll:0},{...s,roll:90},{...s,roll:0},{g:R(3*w,w,.14*w,3),pitch:2.7*w,roll:90}]}
    case 'bar':return[{g:()=>capGeo(4.8*w,.3*w),pitch:4.7*w,roll:0},{g:R(1.1*w,.9*w,.13*w),pitch:.75*w,roll:90}];
    case 'barflat':return[{g:()=>boxGeo(3*w,.78*w,.22*w),pitch:3.05*w,roll:0},{g:R(.9*w,.7*w,.1*w),pitch:.55*w,roll:90}];
    case 'sasa':return[{g:()=>boxGeo(2.6*w,.62*w,.3*w),pitch:2.2*w,roll:35},{g:()=>boxGeo(2.6*w,.62*w,.3*w),pitch:2.2*w,roll:-35}];
    case 'twistlink':return[0,1,2,3,4,5].map(i=>({g:R(1.9*w,w,.14*w),pitch:1.45*w,roll:i*30+(i%2?90:0)}));
    case 'box':return[{g:()=>boxGeo(1.05*w,.92*w,.92*w),pitch:1.0*w,roll:0},{g:()=>boxGeo(1.05*w,.92*w,.92*w),pitch:1.0*w,roll:45}];

    case 'byz':return[{g:R(1.55*w,1.05*w,.13*w),pitch:1.25*w,roll:0},{g:R(.55*w,.5*w,.09*w),pitch:0,roll:90,off:[.18*w,0]},{g:R(.55*w,.5*w,.09*w),pitch:.3*w,roll:90,off:[-.18*w,0]},{g:R(.5*w,.5*w,.09*w),pitch:0,roll:0,off:[0,.15*w]},{g:R(.5*w,.5*w,.09*w),pitch:.38*w,roll:0,off:[0,-.15*w]}];

    case 'beadoval':return[{g:R(2.8*w,w,.12*w,3),pitch:2.5*w,roll:0},{g:R(.8*w,.6*w,.1*w),pitch:.45*w,roll:90},{g:()=>ballGeo(.55*w),pitch:1.05*w,roll:0,mat:'bead'},{g:R(.8*w,.6*w,.1*w),pitch:.45*w,roll:90}];
    case 'circle':return[{g:R(w,w,.12*w),pitch:.8*w,roll:0},{g:R(.45*w,.45*w,.08*w),pitch:0,roll:90,off:[.12*w,0]},{g:R(.45*w,.45*w,.08*w),pitch:.32*w,roll:90,off:[-.12*w,0]}];
    case 'ballwave':return[{g:R(.8*w,.5*w,.1*w),pitch:.62*w,roll:30},{g:R(.8*w,.5*w,.1*w),pitch:.62*w,roll:120},{g:R(.8*w,.5*w,.1*w),pitch:.62*w,roll:210},{g:R(.8*w,.5*w,.1*w),pitch:.62*w,roll:300},{g:()=>ballGeo(.55*w),pitch:1.1*w,roll:0}];

const STRANDS={rope:{n:3,rad:.26,tube:.25,pitch:2.4},twist:{n:2,rad:.22,tube:.24,pitch:2.2},snake:{n:1,rad:0,tube:.5,pitch:1}};

/* ---------- chain shape: nodes (mm, world XY) ---------- */
const nodeCount=len=>Math.max(8,Math.min(260,Math.round(len*10/3.5)+1));
function polyLen(P){let s=0;for(let i=1;i<P.length;i++)s+=Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]);return s}
function resample(P,n,total){// equal spacing along polyline P, n nodes, rescaled to length total, keeps first point
  const d=[0];for(let i=1;i<P.length;i++)d.push(d[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const L=d[d.length-1]||1;
  const dirAt=f=>{const s=f*L;let i=1;while(i<d.length-1&&d[i]<s)i++;const a=P[i-1],b=P[i];const l=Math.hypot(b[0]-a[0],b[1]-a[1])||1;return[(b[0]-a[0])/l,(b[1]-a[1])/l]};
  const sp=total/(n-1),out=[[P[0][0],P[0][1]]];for(let i=1;i<n;i++){const dir=dirAt((i-.5)/(n-1));const q=out[i-1];out.push([q[0]+dir[0]*sp,q[1]+dir[1]*sp])}
  // keep centroid
  const c0=centroid(P),c1=centroid(out);return out.map(p=>[p[0]+c0[0]-c1[0],p[1]+c0[1]-c1[1]])}
function centroid(P){let x=0,y=0;for(const p of P){x+=p[0];y+=p[1]}return[x/P.length,y/P.length]}
function shapeNodes(kind,len,cx,cy){const L=len*10,n=nodeCount(len);let P=[];
  if(kind==='line'){for(let i=0;i<n;i++)P.push([cx-L/2+L*i/(n-1),cy])}
  else if(kind==='u'){const a=Math.min(L/Math.PI*.95,75);let lo=0,hi=800;const per=b=>{let s=0,p=null;for(let i=0;i<=200;i++){const t=-Math.PI/2+Math.PI*i/200,q=[a*Math.sin(t),-b*Math.cos(t)];if(p)s+=Math.hypot(q[0]-p[0],q[1]-p[1]);p=q}return s};
    if(per(0)>L){return shapeNodes('circle',len,cx,cy)}for(let k=0;k<40;k++){const m=(lo+hi)/2;if(per(m)<L)lo=m;else hi=m}const b=lo;
    for(let i=0;i<=300;i++){const t=-Math.PI/2+Math.PI*i/300;P.push([cx+a*Math.sin(t),cy+b*.45-b*Math.cos(t)])}return resample(P,n,L)}
  else{const r=L/(2*Math.PI);for(let i=0;i<=300;i++){const t=Math.PI/2+.06+(2*Math.PI-.12)*i/300;P.push([cx+r*Math.cos(t),cy+r*Math.sin(t)])}return resample(P,n,L)}
  return P}

/* smooth path samples from nodes */
function chainSamples(nodes,w){const v=nodes.map(p=>new THREE.Vector3(p[0],p[1],w*.55));const cr=new THREE.CatmullRomCurve3(v,false,'centripetal');const L=cr.getLength();const N=Math.max(20,Math.round(L*1.6));const pts=cr.getSpacedPoints(N);
  const arc=[0];for(let i=1;i<pts.length;i++)arc.push(arc[i-1]+pts[i].distanceTo(pts[i-1]));
  const T=[],Nn=[];for(let i=0;i<pts.length;i++){const a=pts[Math.max(0,i-1)],b=pts[Math.min(pts.length-1,i+1)];T.push(b.clone().sub(a).normalize());Nn.push(new THREE.Vector3(0,0,1))}
  return{pts,arc,fr:{T,N:Nn},total:arc[arc.length-1]}}
function sampleAt(S,s){const d=S.arc;s=Math.max(0,Math.min(d[d.length-1],s));let lo=0,hi=d.length-1;while(hi-lo>1){const m=(lo+hi)>>1;if(d[m]<s)lo=m;else hi=m}
  const f=(s-d[lo])/((d[hi]-d[lo])||1);return{p:S.pts[lo].clone().lerp(S.pts[hi],f),t:S.fr.T[lo].clone().lerp(S.fr.T[hi],f).normalize(),n:S.fr.N[lo].clone()}}

/* ---------- build chain mesh ---------- */
function buildChain(it,lite){const P=BY[it.no],w=it.w;const S=chainSamples(it.nodes,w);const grp=new THREE.Group();const st=STRANDS[P.ct];
  if(st){for(let k=0;k<st.n;k++){const pts=[];const per=w*st.pitch,step=Math.max(.18,per/(lite?10:22));for(let s=0;s<=S.total;s+=step){const q=sampleAt(S,s),b=q.t.clone().cross(q.n);const ang=s/per*Math.PI*2+k*Math.PI*2/st.n;pts.push(q.p.clone().addScaledVector(q.n,Math.cos(ang)*st.rad*w).addScaledVector(b,Math.sin(ang)*st.rad*w))}
      if(pts.length<4)continue;const m=new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),pts.length,st.tube*w,lite?5:8,false),metal);m.castShadow=true;m.userData.own=true;grp.add(m)}
    if(P.ct==='snake'&&!lite)addInstances(grp,S,[{g:()=>ringGeo(w*.32,w*1.04,w*.06),pitch:w*.42,roll:90}])}
  else addInstances(grp,S,pattern(P.ct,w)||pattern('cable',w));
  // clasp ends: small ring + lobster at the two ends for open chains (rolled chains get a hint ring)
  const endR=ringGeo(Math.max(2.4,w*1.6),Math.max(1.8,w*1.2),Math.max(.25,w*.18));for(const s of [0,S.total]){const a=sampleAt(S,s);const m=new THREE.Mesh(endR,metal);m.position.copy(a.p);m.rotation.z=Math.atan2(a.t.y,a.t.x);m.castShadow=true;grp.add(m)}
  grp.userData.S=S;return grp}
function addInstances(grp,S,pat){const total=S.total,plan=[];let s=0,i=0,guard=0;
  while(s<total&&guard++<30000){const e=pat[i%pat.length];plan.push([e,s]);s+=e.pitch;i++}
  const groups=new Map();for(const [e,c] of plan){const g=e.g();const k=g.uuid+(e.mat||'');if(!groups.has(k))groups.set(k,{g,mat:e.mat==='bead'?grayBead:metal,list:[]});groups.get(k).list.push([e,c])}
  const m=new THREE.Matrix4(),q=new THREE.Quaternion(),rq=new THREE.Quaternion(),basis=new THREE.Matrix4(),one=new THREE.Vector3(1,1,1),X=new THREE.Vector3(1,0,0);
  for(const {g,mat,list} of groups.values()){const im=new THREE.InstancedMesh(g,mat,list.length);im.castShadow=true;let j=0;
    for(const [e,c] of list){const a=sampleAt(S,Math.min(c,total));const x=a.t,z=a.n,y=z.clone().cross(x).normalize();basis.makeBasis(x,y,z);q.setFromRotationMatrix(basis);rq.setFromAxisAngle(X,(e.roll||0)*Math.PI/180);q.multiply(rq);
      const p=a.p.clone();if(e.off)p.addScaledVector(y,e.off[0]).addScaledVector(z,e.off[1]);m.compose(p,q,one);im.setMatrixAt(j++,m)}
    im.instanceMatrix.needsUpdate=true;grp.add(im)}}
function disposeGroup(g){g.traverse(o=>{if(o.userData.own&&o.geometry)o.geometry.dispose();if(o.isInstancedMesh)o.dispose()})}

/* ---------- pendant textures ---------- */
const texCache=new Map();
function loadPendantTex(no){if(texCache.has(no))return texCache.get(no);const P=BY[no];
  const pr=new Promise(res=>{const img=new Image();img.onload=()=>{const w=img.naturalWidth,h=img.naturalHeight;const cv=document.createElement('canvas');cv.width=w;cv.height=h;const cx=cv.getContext('2d');cx.drawImage(img,0,0);const d=cx.getImageData(0,0,w,h).data;
      const A=new Float32Array(w*h),L=new Float32Array(w*h);for(let i=0;i<w*h;i++){A[i]=d[i*4+3]/255;L[i]=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)/255*A[i]}
      let top=-1,bot=-1;for(let y=0;y<h&&top<0;y++)for(let x=0;x<w;x++)if(A[y*w+x]>.5){top=y;break}
      for(let y=h-1;y>=0&&bot<0;y--)for(let x=0;x<w;x++)if(A[y*w+x]>.5){bot=y;break}
      const cxOf=y=>{let s=0,n=0;for(let yy=y;yy<Math.min(h,y+3);yy++)for(let x=0;x<w;x++)if(A[yy*w+x]>.5){s+=x;n++}return n?s/n:w/2};
      const hang=[cxOf(Math.max(0,top))/w-.5,.5-top/h],foot=[cxOf(Math.max(0,bot-2))/w-.5,.5-bot/h];
      const B=new Float32Array(w*h);const r=2;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const xx=Math.min(w-1,Math.max(0,x+dx)),yy=Math.min(h-1,Math.max(0,y+dy));s+=L[yy*w+xx]+A[yy*w+xx]*.6;n++}B[y*w+x]=s/n}
      const nm=cx.createImageData(w,h);const k=3.2;for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;const gx=(B[y*w+Math.min(w-1,x+1)]-B[y*w+Math.max(0,x-1)])*k,gy=(B[Math.min(h-1,y+1)*w+x]-B[Math.max(0,y-1)*w+x])*k;const l=Math.hypot(gx,gy,1);nm.data[i*4]=(-gx/l*.5+.5)*255;nm.data[i*4+1]=(gy/l*.5+.5)*255;nm.data[i*4+2]=(1/l*.5+.5)*255;nm.data[i*4+3]=255}
      const ncv=document.createElement('canvas');ncv.width=w;ncv.height=h;ncv.getContext('2d').putImageData(nm,0,0);
      const map=new THREE.Texture(img);map.colorSpace=THREE.SRGBColorSpace;map.needsUpdate=true;map.anisotropy=8;
      const nmap=new THREE.CanvasTexture(ncv);
      const gw=48,gh=Math.max(8,Math.round(48*h/w)),grid=new Float32Array(gw*gh);for(let y=0;y<gh;y++)for(let x=0;x<gw;x++)grid[y*gw+x]=A[Math.floor((y+.5)/gh*h)*w+Math.floor((x+.5)/gw*w)];
      res({map,nmap,w,h,hang,foot,grid,gw,gh})};img.onerror=()=>res(null);img.src=P.img});
  texCache.set(no,pr);return pr}
async function buildPendant(it){const P=BY[it.no],T=await loadPendantTex(it.no);const grp=new THREE.Group();if(!T)return grp;
  const big=Math.max(T.w,T.h),pw=T.w/big*P.mm,ph=T.h/big*P.mm,th=Math.min(3.2,Math.max(1.1,P.mm*.11));
  const front=new THREE.MeshStandardMaterial({map:T.map,normalMap:T.nmap,normalScale:new THREE.Vector2(.9,.9),metalness:.35,roughness:.3,envMapIntensity:.55,alphaTest:.5});
  const edge=new THREE.MeshStandardMaterial({map:T.map,color:0x8a8e95,metalness:.8,roughness:.3,alphaTest:.5,side:THREE.DoubleSide});
  const back=new THREE.MeshStandardMaterial({map:T.map,color:0xb5b8be,metalness:.5,roughness:.35,alphaTest:.5});
  const pg=new THREE.PlaneGeometry(pw,ph);
  const f=new THREE.Mesh(pg,front);f.position.z=th/2;f.castShadow=true;grp.add(f);
  const b=new THREE.Mesh(pg,back);b.rotation.y=Math.PI;b.position.z=-th/2;grp.add(b);
  const n=Math.max(4,Math.round(th/.3));for(let i=1;i<n;i++){const e=new THREE.Mesh(pg,edge);e.position.z=-th/2+th*i/n;e.castShadow=i===1;grp.add(e)}
  grp.userData={T,pw,ph,th};return grp}

/* ---------- state ---------- */
let st={items:[],nid:1};let base=null;let hist=[],fut=[];
const objs=new Map();let sel=null,dirty=true,viewMode=false;
let prefs=LS.get('pv-prefs',{bg:'velvet',tab:'chain',cf:'여자',pf:'전체'});
const pack=()=>JSON.stringify({items:st.items,nid:st.nid});
function snapshot(){base=pack()}
function commit(){if(base&&base!==pack()){hist.push(base);if(hist.length>80)hist.shift();fut=[]}snapshot();updUndo();autosave();isSample=false;hint()}
function setState(o){st={items:o.items||[],nid:o.nid||1};if(sel&&!itemById(sel))sel=null;snapshot();syncScene();renderSel();updBom()}
function replaceState(o){const prev=pack();setState(o);if(prev!==pack()){hist.push(prev);fut=[]}updUndo();autosave();isSample=false;hint()}
let isSample=false;
function undo(){if(!hist.length)return;fut.push(pack());setState(JSON.parse(hist.pop()));updUndo();autosave();toast('되돌림')}
function redo(){if(!fut.length)return;hist.push(pack());setState(JSON.parse(fut.pop()));updUndo();autosave()}
function updUndo(){$('#bUndo').disabled=!hist.length;$('#bRedo').disabled=!fut.length}
function autosave(){LS.set('pv-current2',{items:st.items,nid:st.nid})}
const itemById=id=>st.items.find(i=>i.id===id);

/* ---------- scene sync ---------- */
const jumpRings=new THREE.Group();scene.add(jumpRings);
const marker=new THREE.Mesh(new THREE.RingGeometry(2.2,3.2,32),new THREE.MeshBasicMaterial({color:0x7fb3ff,depthTest:false,transparent:true}));marker.renderOrder=10;marker.visible=false;scene.add(marker);
const selBox=new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(1,1)),new THREE.LineBasicMaterial({color:0x7fb3ff,depthTest:false,transparent:true,opacity:.75}));selBox.renderOrder=11;selBox.visible=false;scene.add(selBox);
const verOf=it=>it.kind==='chain'?`${it.no}|${it.w}|${it.len}|${JSON.stringify(it.nodes)}`:`${it.no}`;
let syncing=Promise.resolve();
function syncScene(lite){syncing=syncing.then(()=>_sync(lite));return syncing}
async function _sync(lite){for(const [id,o] of objs){if(!itemById(id)){scene.remove(o.grp);disposeGroup(o.grp);objs.delete(id)}}
  for(const it of st.items){const ver=verOf(it);const o=objs.get(it.id);if(o&&o.ver===ver&&!(o.lite&&!lite))continue;
    const g=it.kind==='chain'?buildChain(it,lite):await buildPendant(it);if(o){scene.remove(o.grp);disposeGroup(o.grp)}scene.add(g);objs.set(it.id,{grp:g,ver,lite:!!lite})}
  layout()}
function chainPoint(it,t){const o=objs.get(it.id);if(!o)return null;const S=o.grp.userData.S;return sampleAt(S,t*S.total)}
function pendPoint(it,which){const o=objs.get(it.id);if(!o||!o.grp.userData.T)return null;const u=o.grp.userData,pt=which==='hang'?u.T.hang:u.T.foot;o.grp.updateMatrixWorld();return new THREE.Vector3(pt[0]*u.pw,pt[1]*u.ph,u.th/2).applyMatrix4(o.grp.matrixWorld)}
const RING_L=7.2;// C-ring 5x8 outer, inner length ~5.6
function layout(){jumpRings.clear();const done=new Set();
  const place=(it,depth=0)=>{if(done.has(it.id)||depth>8)return;const o=objs.get(it.id);if(!o)return;const g=o.grp;
    if(it.kind==='chain'){if(it.att){const par=itemById(it.att.to);if(par){place(par,depth+1);const A=par.kind==='chain'?chainPoint(par,it.att.t)?.p:pendPoint(par,'foot');if(A){const R=addJump(A);const dx=R.x-it.nodes[0][0],dy=R.y-it.nodes[0][1];if(Math.abs(dx)>1e-3||Math.abs(dy)>1e-3){it.nodes=it.nodes.map(p=>[p[0]+dx,p[1]+dy]);done.add(it.id);rebuildSoon(it);return}}}}
      done.add(it.id);return}
    const u=g.userData;if(!u.T){done.add(it.id);return}
    const s=it.s||1;g.scale.set(it.flip?-s:s,s,s);g.rotation.set(0,(it.tilt||0)*Math.PI/180,(it.rot||0)*Math.PI/180);
    let z=u.th*s/2+.05;
    if(it.att){const par=itemById(it.att.to);let A=null;if(par){place(par,depth+1);A=par.kind==='chain'?chainPoint(par,it.att.t)?.p:pendPoint(par,'foot')}
      if(A){const R=addJump(A);const hx=u.T.hang[0]*u.pw*(it.flip?-s:s),hy=u.T.hang[1]*u.ph*s;const c=Math.cos(g.rotation.z),sn=Math.sin(g.rotation.z);
        g.position.set(R.x-(hx*c-hy*sn),R.y-(hx*sn+hy*c)+1.1,z+.4)}else it.att=null}
    if(!it.att)g.position.set(it.x,it.y,z);
    g.updateMatrixWorld();done.add(it.id)};
  for(const it of st.items)place(it);updSelBox();updBom();posOverlays();dirty=true}
function addJump(A){// ring hangs down from chain point A; returns its bottom inner point
  const m=new THREE.Mesh(ringGeo(RING_L+1.2,5,.6),metal);m.castShadow=true;m.position.set(A.x,A.y-RING_L/2+1,A.z+.3);m.rotation.set(Math.PI*.42,0,Math.PI/2);jumpRings.add(m);
  return new THREE.Vector3(A.x,A.y-RING_L+1.6,A.z)}
let rbT=null;const rbSet=new Set();function rebuildSoon(it){rbSet.add(it.id);if(rbT)return;rbT=requestAnimationFrame(()=>{rbT=null;rbSet.clear();syncScene(!!drag)})}

/* ---------- camera ---------- */
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(r.width,r.height,false);applyView()}

function updScaleBar(){const r=stage.getBoundingClientRect();const pxPerMm=r.height/view.h*(viewMode?cam.zoom:1);const opts=[1,2,5,10,20,50];let mm=opts.find(v=>v*pxPerMm>=48)||50;$('#scale span').textContent=mm+'mm';$('#scale i').style.width=(mm*pxPerMm)+'px';$('#zlabel').textContent=Math.round(230/view.h*100)+'%'}
new ResizeObserver(resize).observe(stage);
function toWorld(ev){const r=renderer.domElement.getBoundingClientRect();const x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;return new THREE.Vector2(view.cx+(x-.5)*view.h*r.width/r.height,view.cy-(y-.5)*view.h)}
function toScreen(v){const p=v.clone().project(cam),r=renderer.domElement.getBoundingClientRect();return{x:(p.x*.5+.5)*r.width,y:(-p.y*.5+.5)*r.height}}
const mmPerPx=()=>view.h/stage.getBoundingClientRect().height;
function zoomAt(f,wx,wy){const nh=clamp(view.h*f,12,900);if(wx===undefined){wx=view.cx;wy=view.cy}view.cx=wx+(view.cx-wx)*nh/view.h;view.cy=wy+(view.cy-wy)*nh/view.h;view.h=nh;applyView()}
function zoomTo(b,pad=1.5){const r=stage.getBoundingClientRect(),asp=r.width/r.height;view.cx=(b.min.x+b.max.x)/2;view.cy=(b.min.y+b.max.y)/2-(sel?.08:0)*view.h;view.h=clamp(Math.max(b.max.y-b.min.y,(b.max.x-b.min.x)/asp)*pad,20,900);view.cy=(b.min.y+b.max.y)/2-view.h*.08;applyView()}

/* ---------- picking ---------- */
function pick(wp){const tol=mmPerPx()*14;
  for(let i=st.items.length-1;i>=0;i--){const it=st.items[i];if(it.kind!=='pendant')continue;const o=objs.get(it.id);if(!o||!o.grp.userData.T)continue;const g=o.grp,u=g.userData;
    const loc=new THREE.Vector3(wp.x,wp.y,g.position.z);g.worldToLocal(loc);const ux=loc.x/u.pw+.5,uy=.5-loc.y/u.ph;
    if(ux>=-.05&&ux<=1.05&&uy>=-.05&&uy<=1.05){const T=u.T;const gx=Math.min(T.gw-1,Math.max(0,Math.floor(ux*T.gw))),gy=Math.min(T.gh-1,Math.max(0,Math.floor(uy*T.gh)));if(T.grid[gy*T.gw+gx]>.25)return{it}}
    const c=new THREE.Vector3().applyMatrix4(g.matrixWorld);if(Math.hypot(c.x-wp.x,c.y-wp.y)<Math.max(tol*.8,Math.min(u.pw,u.ph)*(it.s||1)*.35))return{it}}
  let best=null,bd=1e9;for(let i=st.items.length-1;i>=0;i--){const it=st.items[i];if(it.kind!=='chain')continue;const o=objs.get(it.id);if(!o)continue;const S=o.grp.userData.S;
    for(let k=0;k<S.pts.length;k+=2){const v=S.pts[k];const d=Math.hypot(v.x-wp.x,v.y-wp.y);if(d<bd){bd=d;best={it,t:S.arc[k]/S.total}}}}
  if(best&&bd<Math.max(tol,best.it.w*1.2))return best;return null}
function nearestAttach(it){let hp;if(it.kind==='pendant')hp=pendPoint(it,'hang');else hp=new THREE.Vector3(it.nodes[0][0],it.nodes[0][1],0);
  if(!hp)return null;const tol=Math.max(8,mmPerPx()*30);let best=null,bd=tol;
  for(const c of st.items){if(c.id===it.id||isDesc(c,it.id))continue;const o=objs.get(c.id);if(!o)continue;
    if(c.kind==='chain'){const S=o.grp.userData.S;for(let k=0;k<S.pts.length;k++){const v=S.pts[k];const d=Math.hypot(v.x-hp.x,v.y-(hp.y+RING_L-1.6));if(d<bd){bd=d;best={to:c.id,t:S.arc[k]/S.total,P:v.clone()}}}}
    else if(it.kind==='pendant'){const P=pendPoint(c,'foot');if(!P)continue;const d=Math.hypot(P.x-hp.x,P.y-(hp.y+RING_L-1.6));if(d<bd){bd=d;best={to:c.id,P}}}}
  return best}
function isDesc(c,rootId){let x=c,g=0;while(x&&x.att&&g++<10){if(x.att.to===rootId)return true;x=itemById(x.att.to)}return false}

/* ---------- rope bending (position based) ---------- */
function bendChain(it,k,tx,ty){const N=it.nodes,n=N.length,sp=it.len*10/(n-1);const dx0=tx-N[k][0],dy0=ty-N[k][1];const rad=Math.max(3,n*.16);
  for(let i=0;i<n;i++){const q=(i-k)/rad,w=Math.exp(-q*q);N[i][0]+=dx0*w;N[i][1]+=dy0*w}N[k]=[tx,ty];
  for(let iter=0;iter<30;iter++){for(let i=0;i<n-1;i++){const a=N[i],b=N[i+1];const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1e-6,diff=(d-sp)/d;
      const wa=i===k?0:(i+1===k?1:.5),wb=i+1===k?0:(i===k?1:.5);a[0]+=dx*diff*wa;a[1]+=dy*diff*wa;b[0]-=dx*diff*wb;b[1]-=dy*diff*wb}N[k]=[tx,ty]}
  const fol=(i,j)=>{const a=N[j],b=N[i];const dx=b[0]-a[0],dy=b[1]-a[1],d=Math.hypot(dx,dy)||1e-6;N[i]=[a[0]+dx/d*sp,a[1]+dy/d*sp]};for(let i=k+1;i<n;i++)fol(i,i-1);for(let i=k-1;i>=0;i--)fol(i,i+1)}
function nearestNode(it,wp){let k=0,bd=1e9;it.nodes.forEach((p,i)=>{const d=Math.hypot(p[0]-wp.x,p[1]-wp.y);if(d<bd){bd=d;k=i}});return k}

/* ---------- interaction ---------- */
const ptrs=new Map();let drag=null,cand=null,lastTap=0;
const cvs=renderer.domElement;
cvs.addEventListener('pointerdown',e=>{if(viewMode)return;cvs.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});hideFab();
  if(ptrs.size===1){const wp=toWorld(e),h=pick(wp);
    if(h){const it=h.it;const already=sel===it.id;select(it.id);
      if(it.kind==='chain')drag={type:'bend',it,k:nearestNode(it,wp),sx:e.clientX,sy:e.clientY,moved:false,already};
      else drag={type:'obj',it,start:wp,sx:e.clientX,sy:e.clientY,moved:false,ox:it.x,oy:it.y,already}}
    else drag={type:'pan',sx:e.clientX,sy:e.clientY,cx:view.cx,cy:view.cy,moved:false}}
  else if(ptrs.size===2){if(drag&&drag.moved&&drag.type!=='pan')commit();const [a,b]=[...ptrs.values()];const r=cvs.getBoundingClientRect();const mid={clientX:(a.x+b.x)/2,clientY:(a.y+b.y)/2};
    drag={type:'pinch',d0:Math.hypot(a.x-b.x,a.y-b.y),h0:view.h,w0:toWorld(mid),moved:true}}});
cvs.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId)||!drag)return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const far=Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>=5;
  if(drag.type==='obj'){if(!drag.moved&&!far)return;drag.moved=true;const it=drag.it,wp=toWorld(e);
    if(it.att&&itemById(it.att.to)?.kind==='chain'){const par=itemById(it.att.to);const S=objs.get(par.id).grp.userData.S;let bd=1e9,bt=it.att.t;for(let k=0;k<S.pts.length;k++){const v=S.pts[k];const d=Math.hypot(v.x-wp.x,v.y-(wp.y+6));if(d<bd){bd=d;bt=S.arc[k]/S.total}}it.att.t=bt;layout();return}
    if(it.att)return;it.x=drag.ox+(wp.x-drag.start.x);it.y=drag.oy+(wp.y-drag.start.y);layout();cand=nearestAttach(it);showMarker(cand)}
  else if(drag.type==='bend'){if(!drag.moved&&!far)return;drag.moved=true;const wp=toWorld(e);bendChain(drag.it,drag.k,wp.x,wp.y);if(drag.it.att&&drag.k!==0){}rebuildSoon(drag.it);if(!drag.it.att&&drag.k===0){cand=nearestAttach(drag.it);showMarker(cand)}}
  else if(drag.type==='move'){const wp=toWorld(e);const dx=wp.x-drag.last.x,dy=wp.y-drag.last.y;drag.last=wp;drag.moved=true;drag.it.nodes=drag.it.nodes.map(p=>[p[0]+dx,p[1]+dy]);rebuildSoon(drag.it);if(!drag.it.att){cand=nearestAttach(drag.it);showMarker(cand)}}
  else if(drag.type==='pan'){if(!drag.moved&&!far)return;drag.moved=true;const k=mmPerPx();view.cx=drag.cx-(e.clientX-drag.sx)*k;view.cy=drag.cy+(e.clientY-drag.sy)*k;applyView()}
  else if(drag.type==='pinch'&&ptrs.size>=2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);const nh=clamp(drag.h0*drag.d0/d,12,900);
    const r=cvs.getBoundingClientRect();const mx=((a.x+b.x)/2-r.left)/r.width,my=((a.y+b.y)/2-r.top)/r.height;view.h=nh;view.cx=drag.w0.x-(mx-.5)*nh*r.width/r.height;view.cy=drag.w0.y+(my-.5)*nh;applyView()}});
function endPtr(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);if(ptrs.size>0){if(drag?.type==='pinch')drag={type:'none'};return}const d=drag;drag=null;marker.visible=false;dirty=true;if(!d)return;
  if(d.type==='bend'||d.type==='move'){if(d.moved){syncScene(false);commit();if(cand&&!d.it.att&&(d.type==='move'||d.k===0)){const c=cand;showFab('끼우기',c.P,()=>doAttach(d.it,c))}}else tapItem(d.it)}
  else if(d.type==='obj'){if(d.moved){commit();if(cand){const c=cand;showFab('끼우기',c.P,()=>doAttach(d.it,c))}}else tapItem(d.it)}
  else if(d.type==='pan'&&!d.moved){select(null)}}
function tapItem(it){const now=Date.now();if(now-lastTap<320){focusSel();lastTap=0;return}lastTap=now;
  if(it.att){const P=it.kind==='pendant'?pendPoint(it,'hang'):new THREE.Vector3(it.nodes[0][0],it.nodes[0][1],0);showFab('빼기',P,()=>doDetach(it),true)}
  else{const c=nearestAttach(it);if(c&&(it.kind==='pendant'||true)){showFab('끼우기',c.P,()=>doAttach(it,c))}}}
cvs.addEventListener('pointerup',endPtr);cvs.addEventListener('pointercancel',endPtr);
cvs.addEventListener('wheel',e=>{if(viewMode)return;e.preventDefault();const wp=toWorld(e);zoomAt(Math.exp(e.deltaY*.0015),wp.x,wp.y);hideFab()},{passive:false});
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function showMarker(c){if(!c){marker.visible=false;dirty=true;return}marker.position.set(c.P.x,c.P.y,60);marker.visible=true;dirty=true}

/* move handle for chains (DOM, follows the chain) */
const hmove=$('#hmove');
hmove.addEventListener('pointerdown',e=>{const it=sel&&itemById(sel);if(!it||it.kind!=='chain')return;e.stopPropagation();hmove.setPointerCapture(e.pointerId);hideFab();drag={type:'move',it,last:toWorld(e),moved:false};ptrs.clear();ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY})});
hmove.addEventListener('pointermove',e=>{if(drag?.type!=='move')return;const wp=toWorld(e);const dx=wp.x-drag.last.x,dy=wp.y-drag.last.y;drag.last=wp;drag.moved=true;drag.it.nodes=drag.it.nodes.map(p=>[p[0]+dx,p[1]+dy]);rebuildSoon(drag.it);cand=nearestAttach(drag.it);showMarker(cand)});
hmove.addEventListener('pointerup',e=>{if(drag?.type==='move')endPtr(e)});

/* overlays: fab (끼우기/빼기), delete button, move handle */
const fab=$('#fab'),fdel=$('#fdel');let fabAnchor=null;
function showFab(txt,P,fn,out=false){fab.textContent=txt;fab.className=out?'out':'';fab.onclick=()=>{hideFab();fn()};fabAnchor=P.clone();fab.hidden=false;posOverlays()}
function hideFab(){fab.hidden=true;fabAnchor=null;cand=null}
function posOverlays(){if(!fab.hidden&&fabAnchor){const s=toScreen(fabAnchor);fab.style.left=s.x+'px';fab.style.top=s.y+'px'}
  const it=sel&&itemById(sel);if(!it||viewMode||!selBox.visible){fdel.hidden=true;hmove.hidden=true;return}
  const tr=toScreen(new THREE.Vector3(selBox.position.x+selBox.scale.x/2,selBox.position.y+selBox.scale.y/2,0));const r=stage.getBoundingClientRect();
  fdel.hidden=false;fdel.style.left=clamp(tr.x+22,30,r.width-30)+'px';fdel.style.top=clamp(tr.y-14,20,r.height-24)+'px';
  if(it.kind==='chain'&&!it.att){const m=it.nodes[Math.floor(it.nodes.length/2)];const s=toScreen(new THREE.Vector3(m[0],m[1],0));hmove.hidden=false;hmove.style.left=clamp(s.x,24,r.width-24)+'px';hmove.style.top=clamp(s.y-34,24,r.height-24)+'px'}else hmove.hidden=true}
fdel.onclick=()=>{const it=sel&&itemById(sel);if(it)act(it,'del')};
function doAttach(it,c){it.att=c.t!==undefined?{to:c.to,t:c.t}:{to:c.to};if(it.kind==='pendant')it.rot=0;layout();commit();renderSel();toast('끼움 · C링 1개 추가')}
function doDetach(it){if(it.kind==='pendant'){const g=objs.get(it.id).grp;it.x=g.position.x+12;it.y=g.position.y-4}else{it.nodes=it.nodes.map(p=>[p[0]+12,p[1]-4]);rebuildSoon(it)}it.att=null;layout();commit();renderSel();toast('뺌')}

/* ---------- selection UI ---------- */
let selParam='size';
function select(id){if(sel!==id){sel=id;if(id){const it=itemById(id);selParam=it.kind==='chain'?'len':'size'}}renderSel();updSelBox()}
function updSelBox(){const it=sel&&itemById(sel);if(!it||viewMode){selBox.visible=false;posOverlays();dirty=true;return}const o=objs.get(it.id);if(!o){selBox.visible=false;posOverlays();return}
  const b=new THREE.Box3().setFromObject(o.grp);const pad=1.5;selBox.scale.set(b.max.x-b.min.x+pad*2,b.max.y-b.min.y+pad*2,1);selBox.position.set((b.max.x+b.min.x)/2,(b.max.y+b.min.y)/2,80);selBox.visible=true;posOverlays();dirty=true}
function focusSel(){const it=sel&&itemById(sel);if(!it)return;const o=objs.get(it.id);if(!o)return;const b=new THREE.Box3().setFromObject(o.grp);zoomTo(b,it.kind==='chain'?1.25:3)}
function renderSel(onlyVals){const box=$('#sel'),it=sel&&itemById(sel);if(!it||viewMode){box.hidden=true;return}box.hidden=false;const P=BY[it.no];
  const params=it.kind==='chain'?[['len','길이'],['w','굵기']]:[['size','크기'],['rot','회전'],['tilt','기울기']];
  if(!params.find(p=>p[0]===selParam))selParam=params[0][0];
  const val=paramVal(it,selParam);
  if(onlyVals&&$('#pv')){$('#pv').value=val.v;$('#po').textContent=val.label;return}
  let ctrl='';
  if(selParam==='len'&&P.lens)ctrl=`<div class="pills">${P.lens.map(l=>`<button class="pill ${it.len===l?'on':''}" data-len="${l}">${l}cm</button>`).join('')}</div><output id="po">${val.label}</output>`;
  else if(selParam==='w')ctrl=`<div class="pills">${P.widths.map(w=>`<button class="pill ${it.w===w?'on':''}" data-w="${w}">${w}mm</button>`).join('')}</div><input type="range" id="pv" min="${val.min}" max="${val.max}" step="${val.step}" value="${val.v}" aria-label="굵기"><output id="po">${val.label}</output>`;
  else ctrl=`<input type="range" id="pv" min="${val.min}" max="${val.max}" step="${val.step}" value="${val.v}" aria-label="${selParam}"><output id="po">${val.label}</output>`;
  const acts=[];
  if(it.kind==='chain')acts.push(`<button class="act" data-a="line">일자로</button>`,`<button class="act" data-a="u">U자로</button>`,`<button class="act" data-a="circle">원으로</button>`);
  if(it.att)acts.push(`<button class="act blue" data-a="detach">빼기</button>`);
  if(it.kind==='pendant')acts.push(`<button class="act" data-a="flip">좌우반전</button>`,`<button class="act" data-a="real">실제 크기</button>`);
  acts.push(`<button class="act" data-a="zoom">크게 보기</button>`,`<button class="act" data-a="front">맨 앞으로</button>`,`<button class="act" data-a="dup">복제</button>`,`<button class="act" data-a="info">정보</button>`,`<button class="act red" data-a="del">삭제</button>`);
  box.innerHTML=`<div class="top"><div class="ttl">No.${P.no} <span>${esc(shortName(P))}${it.att?' · 끼움':''}</span></div><div class="pills">${params.map(p=>`<button class="pill ${p[0]===selParam?'on':''}" data-p="${p[0]}">${p[1]}</button>`).join('')}</div></div>
  <div class="prow">${ctrl}</div><div class="acts">${acts.join('')}</div>${it.kind==='chain'?'<div class="tip">체인을 잡고 끌면 구부러지고, ✥ 손잡이로 통째로 옮김</div>':''}`;
  box.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{selParam=b.dataset.p;renderSel()});
  box.querySelectorAll('[data-len]').forEach(b=>b.onclick=()=>{setLen(it,+b.dataset.len);commit();renderSel()});
  box.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{it.w=+b.dataset.w;syncScene();commit();renderSel()});
  const pv=$('#pv');if(pv){pv.oninput=()=>{setParam(it,selParam,+pv.value);$('#po').textContent=paramVal(it,selParam).label};pv.onchange=()=>{if(it.kind==='chain')syncScene(false);commit()}}
  box.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(it,b.dataset.a))}
function paramVal(it,p){const P=BY[it.no];
  if(p==='size'){const s=it.s||1;return{v:s,min:.3,max:4,step:.05,label:`${(P.mm*s).toFixed(1)}mm${Math.abs(s-1)<.01?' 실제':` ×${s.toFixed(2)}`}`}}
  if(p==='rot')return{v:it.rot||0,min:-180,max:180,step:1,label:`${it.rot||0}°`};
  if(p==='tilt')return{v:it.tilt||0,min:-80,max:80,step:1,label:`${it.tilt||0}°`};
  if(p==='len')return{v:it.len,min:1,max:90,step:.5,label:`${it.len}cm`};
  if(p==='w')return{v:it.w,min:Math.max(.5,P.widths[0]*.4),max:Math.min(14,P.widths[P.widths.length-1]*3),step:.1,label:`${(+it.w).toFixed(1)}mm${P.widths.includes(+it.w)?'':' (판매 굵기 아님)'}`};
  return{v:0,min:0,max:1,step:1,label:''}}
function setLen(it,len){it.len=len;it.nodes=resample(it.nodes,nodeCount(len),len*10);rebuildSoon(it)}
function setParam(it,p,v){if(p==='size')it.s=v;else if(p==='rot')it.rot=v;else if(p==='tilt')it.tilt=v;else if(p==='len'){setLen(it,v);return}else if(p==='w'){it.w=Math.round(v*10)/10;rebuildSoon(it);return}layout()}
function act(it,a){const P=BY[it.no];
  if(a==='del'){st.items=st.items.filter(x=>x.id!==it.id);for(const c of st.items)if(c.att&&c.att.to===it.id){const g=objs.get(c.id)?.grp;if(c.kind==='pendant'&&g){c.x=g.position.x;c.y=g.position.y}c.att=null}sel=null;syncScene();commit();renderSel();hideFab();toast('삭제함 · 되돌리기로 복구 가능')}
  else if(a==='dup'){const c=structuredClone(it);c.id=st.nid++;c.att=null;if(c.kind==='chain')c.nodes=c.nodes.map(p=>[p[0]+8,p[1]-10]);else{const g=objs.get(it.id)?.grp;c.x=(g?g.position.x:it.x)+14;c.y=(g?g.position.y:it.y)-8}st.items.push(c);sel=c.id;syncScene();commit();renderSel()}
  else if(a==='front'){st.items=st.items.filter(x=>x!==it);st.items.push(it);layout();commit()}
  else if(a==='flip'){it.flip=!it.flip;layout();commit()}
  else if(a==='real'){it.s=1;layout();commit();renderSel()}
  else if(a==='detach')doDetach(it);
  else if(a==='zoom')focusSel();
  else if(['line','u','circle'].includes(a)){const c=centroid(it.nodes);it.nodes=shapeNodes(a,it.len,c[0],c[1]);if(a==='line')it.nodes=it.nodes;syncScene();commit()}
  else if(a==='info')showInfo(P)}

/* ---------- add parts ---------- */
function addPart(no){const P=BY[no];hideFab();
  if(P.g==='chain'){const len=P.lens?P.lens[0]:(P.tags.includes('포인트')&&!P.tags.includes('여자')&&!P.tags.includes('남자')?6:45);
    const r=stage.getBoundingClientRect();const fitLen=Math.min(len,view.h*r.width/r.height*.85/10);
    const it={id:st.nid++,kind:'chain',no,w:P.widths[0],len,nodes:[]};
    // straight, centred in view; if longer than the view, gently curved so it stays on screen
    const y0=view.cy+view.h*.28;it.nodes=shapeNodes('line',len,view.cx,y0);
    if(len>fitLen){const r2=stage.getBoundingClientRect();const nh=len*10*1.15*r2.height/r2.width;view.cy=y0-nh*.22;view.h=nh;applyView()}
    st.items.unshift(it);sel=it.id;selParam='len';syncScene().then(()=>{commit();renderSel();updSelBox()});renderSel();toast(`No.${no} 추가 · 끌어서 구부려 봐`);return}
  const tgt=(sel&&itemById(sel)?.kind==='chain')?itemById(sel):st.items.filter(i=>i.kind==='chain').slice(-1)[0];
  const it={id:st.nid++,kind:'pendant',no,x:view.cx,y:view.cy,rot:0,tilt:0,s:1};st.items.push(it);sel=it.id;selParam='size';
  syncScene().then(()=>{const u=objs.get(it.id)?.grp.userData;if(tgt&&u?.T){const S=objs.get(tgt.id).grp.userData.S;let k=0,by=1e9;S.pts.forEach((p,i)=>{if(p.y<by){by=p.y;k=i}});const t=S.arc[k]/S.total;const A=S.pts[k];
      it.x=A.x+u.pw*.9+4;it.y=A.y-u.ph*.6-4;layout();const c={to:tgt.id,t,P:A.clone()};if(view.h>130){view.h=110;view.cx=A.x+8;view.cy=A.y-12;applyView()}else ensureVisible(A);showFab('끼우기',c.P,()=>doAttach(it,c))}commit();renderSel();updSelBox()});renderSel()}
function ensureVisible(P){const s=toScreen(P),r=stage.getBoundingClientRect();if(s.y<r.height*.12||s.y>r.height*.55||s.x<0||s.x>r.width){view.cy=P.y-.14*view.h;view.cx=P.x;applyView()}}

/* ---------- list ---------- */
function shortName(P){return P.name.replace(/써지컬스틸|써지컬|팬던트|펜던트|체인/g,' ').replace(/\s+/g,' ').trim()||P.name}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function priceText(P){if(!P.price)return'가격 미확인';if(P.per==='m')return won(P.price)+'/1m';if(P.per==='50cm')return won(P.price)+'/50cm';return won(P.price)}
function renderFilters(){const f=$('#filters'),narrow=innerWidth<=760;

/* ---------- chain thumbnails rendered from the 3D generator ---------- */
const chainThumbs=new Map();
async function makeChainThumbs(){const sz=220;const sc=new THREE.Scene();sc.environment=scene.environment;const l=new THREE.DirectionalLight(0xffffff,1.6);l.position.set(120,200,300);sc.add(l);sc.add(new THREE.AmbientLight(0xffffff,.25));
  const c2=new THREE.OrthographicCamera(-1,1,1,-1,-500,500);c2.position.set(0,0,200);
  const out=document.createElement('canvas');out.width=out.height=sz;const ox=out.getContext('2d');
  for(const P of PARTS.filter(p=>p.g==='chain')){const w=P.widths[0];const len=Math.max(14,w*9)/10;const g=buildChain({no:P.no,w,len,nodes:shapeNodes('line',len,0,0)});g.rotation.z=Math.PI/4;sc.add(g);
    const h=len*10*.78;c2.left=-h/2;c2.right=h/2;c2.top=h/2;c2.bottom=-h/2;c2.updateProjectionMatrix();
    const pr=renderer.getPixelRatio(),old=new THREE.Vector2();renderer.getSize(old);renderer.setPixelRatio(1);renderer.setSize(sz,sz,false);renderer.setClearColor(0x000000,0);renderer.render(sc,c2);
    ox.clearRect(0,0,sz,sz);ox.drawImage(renderer.domElement,0,0,sz,sz,0,0,sz,sz);renderer.setPixelRatio(pr);renderer.setSize(old.x,old.y,false);
    const url=out.toDataURL('image/png');chainThumbs.set(P.no,url);sc.remove(g);g.traverse(o=>{if(o.isMesh&&!o.isInstancedMesh)o.geometry.dispose()});
    document.querySelectorAll(`[data-ph="${P.no}"]`).forEach(el=>el.style.backgroundImage=`url('${url}')`)}
  dirty=true}

function loadMine(){PARTS=PARTS.filter(p=>!p.mine);for(const m of LS.get('pv-mine',[])){const p={...m,g:'pendant',mine:true,cat:'내 부품',tags:[],vendor:m.vendor||'직접 추가',per:m.price?'piece':null,unit:'1개',size:m.mm+'mm (입력값)',mat:'-',tone:'-',mmest:0};PARTS.push(p);BY[p.no]=p;texCache.delete(p.no)}}
const upf=document.createElement('input');upf.type='file';upf.accept='image/*';upf.id='upf';upf.hidden=true;document.body.appendChild(upf);
upf.onchange=()=>{const f=upf.files[0];upf.value='';if(!f)return;const img=new Image();img.onload=()=>openCutout(img);img.onerror=()=>toast('이 사진은 열 수 없어');img.src=URL.createObjectURL(f)};
function openCutout(img){const M=600,k=Math.min(1,M/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*k),h=Math.round(img.naturalHeight*k);
  const src=document.createElement('canvas');src.width=w;src.height=h;const sx=src.getContext('2d');sx.drawImage(img,0,0,w,h);const D=sx.getImageData(0,0,w,h).data;
  openSheet(`<h3>사진으로 부품 만들기<button class="x">닫기</button></h3><canvas id="upc"></canvas>
   <div class="prow" style="margin-top:10px"><span style="font-size:12px;color:var(--mute);white-space:nowrap">배경 지우기 세기</span><input type="range" id="upt" min="6" max="90" value="34"><output id="upo" style="min-width:30px">34</output></div>
   <label style="font-size:13px;display:flex;gap:6px;align-items:center;margin-top:6px"><input type="checkbox" id="upbig" checked> 가장 큰 덩어리 하나만 남기기</label>
   <div class="frm"><label for="upn">이름</label><input id="upn" value="내 부품"><label for="upm">긴 쪽 크기(mm)</label><input id="upm" type="number" inputmode="decimal" value="18" min="2" max="120"><label for="upp">가격(원, 선택)</label><input id="upp" type="number" inputmode="numeric" placeholder="모르면 비움"></div>
   <div class="row"><button class="hbtn on" id="upgo">부품으로 추가</button></div>
   <div class="note">흰 배경·단색 배경에서 찍은 사진이 잘 됨. 테두리 색을 배경으로 보고 지움. 저장은 이 기기에만 남음.</div>`);
  let out=null;
  const run=()=>{const thr=+$('#upt').value;$('#upo').textContent=thr;
    // background colour = median of border pixels
    const br=[],bg=[],bb=[];const push=i=>{br.push(D[i*4]);bg.push(D[i*4+1]);bb.push(D[i*4+2])};for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
    const med=a=>a.sort((p,q)=>p-q)[a.length>>1];const B=[med(br),med(bg),med(bb)];
    const dist=i=>Math.hypot(D[i*4]-B[0],D[i*4+1]-B[1],D[i*4+2]-B[2]);
    const bgm=new Uint8Array(w*h),q=new Int32Array(w*h);let qh=0,qt=0;const seed=i=>{if(!bgm[i]&&(dist(i)<thr||D[i*4+3]<20)){bgm[i]=1;q[qt++]=i}};
    for(let x=0;x<w;x++){seed(x);seed((h-1)*w+x)}for(let y=0;y<h;y++){seed(y*w);seed(y*w+w-1)}
    while(qh<qt){const i=q[qh++],x=i%w,y=(i/w)|0;if(x>0)seed(i-1);if(x<w-1)seed(i+1);if(y>0)seed(i-w);if(y<h-1)seed(i+w)}
    let fg=new Uint8Array(w*h);for(let i=0;i<w*h;i++)fg[i]=bgm[i]?0:1;
    if($('#upbig').checked){const lab=new Int32Array(w*h).fill(-1);let best=-1,bs=0,id=0;for(let i=0;i<w*h;i++){if(!fg[i]||lab[i]>=0)continue;let n=0,sx=0,sy=0,edge=0;qh=qt=0;q[qt++]=i;lab[i]=id;while(qh<qt){const j=q[qh++];n++;const x=j%w,y=(j/w)|0;sx+=x;sy+=y;if(x<2||y<2||x>w-3||y>h-3)edge++;for(const k of [x>0?j-1:-1,x<w-1?j+1:-1,y>0?j-w:-1,y<h-1?j+w:-1])if(k>=0&&fg[k]&&lab[k]<0){lab[k]=id;q[qt++]=k}}const d=Math.hypot(sx/n-w/2,sy/n-h/2)/(Math.max(w,h)/2);const sc=n*(1.2-.6*d)*(edge>4?.12:1);if(sc>bs){bs=sc;best=id}id++}for(let i=0;i<w*h;i++)fg[i]=lab[i]===best?1:0}
    let x0=w,y0=h,x1=0,y1=0;for(let i=0;i<w*h;i++)if(fg[i]){const x=i%w,y=(i/w)|0;if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
    const c=$('#upc');if(x1<x0){c.width=w;c.height=h;c.getContext('2d').clearRect(0,0,w,h);out=null;return}
    x0=Math.max(0,x0-3);y0=Math.max(0,y0-3);x1=Math.min(w-1,x1+3);y1=Math.min(h-1,y1+3);const cw=x1-x0+1,ch=y1-y0+1;c.width=cw;c.height=ch;const cx=c.getContext('2d');const o=cx.createImageData(cw,ch);
    for(let y=0;y<ch;y++)for(let x=0;x<cw;x++){const si=(y+y0)*w+x+x0,di=(y*cw+x)*4;let a=fg[si];
      if(a){let nb=0;for(const k of [si-1,si+1,si-w,si+w])if(k>=0&&k<w*h&&!fg[k])nb++;a=nb?0.55:1}
      o.data[di]=D[si*4];o.data[di+1]=D[si*4+1];o.data[di+2]=D[si*4+2];o.data[di+3]=a*255}
    cx.putImageData(o,0,0);out=c};
  $('#upt').oninput=run;$('#upbig').onchange=run;run();
  $('#upgo').onclick=()=>{if(!out){toast('남은 부분이 없어. 세기를 낮춰 봐');return}const M=LS.get('pv-mine',[]);const no=9001+M.reduce((m,x)=>Math.max(m,x.no-9001+1),0);
    const url=out.toDataURL('image/webp',.9);const mm=Math.max(2,+$('#upm').value||18);const price=+$('#upp').value||null;
    M.push({no,name:$('#upn').value.trim()||'내 부품',img:url,mm,price,iw:out.width,ih:out.height});if(!LS.set('pv-mine',M))toast('이 브라우저는 저장이 막혀서 이번에만 쓸 수 있어');else LS.set('pv-mine',M);
    if(!LS.get('pv-mine',[]).find(m=>m.no===no)){const p={no,name:$('#upn').value||'내 부품',img:url,mm,price,g:'pendant',mine:true,cat:'내 부품',tags:[],vendor:'직접 추가',per:price?'piece':null,unit:'1개',size:mm+'mm',mat:'-',tone:'-',mmest:0};PARTS.push(p);BY[no]=p}else loadMine();
    closeSheet();prefs.tab='pendant';document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab==='pendant'));renderFilters();renderList();addPart(no)}}

/* sample */
function sample(){return{items:[{id:1,kind:'chain',no:214,w:2,len:45,nodes:shapeNodes('u',45,0,0)},{id:2,kind:'chain',no:10,w:1.9,len:50,nodes:shapeNodes('u',50,0,-12)},{id:3,kind:'pendant',no:310,x:0,y:-120,rot:0,tilt:0,s:1,att:{to:1,t:.5}},{id:4,kind:'pendant',no:316,x:0,y:-150,rot:0,tilt:0,s:1,att:{to:2,t:.5}}],nid:5}}

/* render loop */
function render(){renderer.render(scene,cam)}
function loop(){if(dirty){render();dirty=false}requestAnimationFrame(loop)}

/* boot */
fetch('parts.json').then(r=>r.json()).then(d=>{PARTS=d;for(const p of d)BY[p.no]=p;loadMine();
  setBg(prefs.bg||'velvet');document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===prefs.tab));
  renderFilters();renderList();addEventListener('resize',()=>{renderFilters()});
  const cur=LS.get('pv-current2',null);const init=cur&&cur.items&&cur.items.length?cur:sample();
  setState(init);isSample=!(cur&&cur.items&&cur.items.length);updUndo();hint();resize();
  makeChainThumbs();setTimeout(()=>{fit()},400);loop()}).catch(e=>{$('#hint').textContent='부품 목록을 못 불러왔어: '+e.message});

</script>
